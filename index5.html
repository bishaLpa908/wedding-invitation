<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Flower Greeting</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Poppins", sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#eee;
}

.card{
    position:relative;
    width:400px;
    height:700px;
    background:url("background.png") no-repeat center/cover;
    overflow:hidden;
    border-radius:20px;
    box-shadow:0 20px 60px rgba(0,0,0,0.2);
    perspective:1200px;
}

/* Flower */
.flower{
    position:absolute;
    top:-40px;
    left:-20px;
    width:340px;
    transform-style: preserve-3d;
    transition: transform 0.2s ease;
    pointer-events:none;
}

.flower img{
    width:100%;
    filter: drop-shadow(0 25px 25px rgba(0,0,0,0.25));
}

/* text area */
.textBox{
    position:absolute;
    bottom:120px;
    width:100%;
    text-align:center;
    padding:20px;
}

/* couple names */
.couple{
    font-size:32px;
    font-weight:600;
    color:white;
    margin-bottom:20px;
    letter-spacing:1px;
}

/* main line */
.line{
    font-size:38px;
    font-weight:600;
    color:white;
    letter-spacing:1px;
}

/* sub line */
.sub{
    margin-top:20px;
    font-size:22px;
    color:white;
    font-weight:500;
}

/* word animation */
.word{
    opacity:0;
    transform:translateY(20px);
    display:inline-block;
    margin:0 6px;
}

.show{
    animation:fadeUp 1.2s forwards;
}

@keyframes fadeUp{
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="card" id="card">

    <!-- Flower -->
    <div class="flower" id="flower">
        <img src="flower.png">
    </div>

    <!-- TEXT -->
    <div class="textBox">

        <!-- Bride Groom Names -->
        <div class="couple" id="coupleNames"></div>

        <!-- Main line -->
        <div class="line" id="mainLine"></div>

        <!-- Sub line -->
        <div class="sub" id="subLine"></div>

    </div>
</div>

<script>

/* ===== CHANGE NAMES HERE ===== */
const coupleText = "Chiranjit ❤ Jaba";   // change bride & groom name

/* ===== TEXT ===== */
const mainText = "Congratulations on your engagement";
const subText = "May your hearts always beat as one full of hope joy and love";

/* ===== SELECTORS ===== */
const coupleContainer = document.getElementById("coupleNames");
const mainContainer = document.getElementById("mainLine");
const subContainer = document.getElementById("subLine");

/* ===== ADD WORDS ===== */
coupleText.split(" ").forEach(word=>{
    const span=document.createElement("span");
    span.className="word";
    span.innerText=word;
    coupleContainer.appendChild(span);
});

mainText.split(" ").forEach(word=>{
    const span=document.createElement("span");
    span.className="word";
    span.innerText=word;
    mainContainer.appendChild(span);
});

subText.split(" ").forEach(word=>{
    const span=document.createElement("span");
    span.className="word";
    span.innerText=word;
    subContainer.appendChild(span);
});

/* ===== ANIMATION ===== */
const words=document.querySelectorAll(".word");
let i=0;

function animateWords(){
    if(i<words.length){
        words[i].classList.add("show");
        i++;
        setTimeout(animateWords,600); // speed here
    }
}
animateWords();

/* ===== 3D FLOWER ===== */
const card=document.getElementById("card");
const flower=document.getElementById("flower");

card.addEventListener("mousemove",(e)=>{
    const rect=card.getBoundingClientRect();
    const x=e.clientX-rect.left;
    const y=e.clientY-rect.top;

    const rotateY=(x/rect.width-0.5)*20;
    const rotateX=-(y/rect.height-0.5)*20;

    flower.style.transform=`
        rotateX(${rotateX}deg)
        rotateY(${rotateY}deg)
        translateZ(40px)
        scale(1.05)
    `;
});

card.addEventListener("mouseleave",()=>{
    flower.style.transform=`
        rotateX(0deg) rotateY(0deg) translateZ(0px) scale(1)
    `;
});
/* Auto move to Page 4 */
setTimeout(()=>{
    document.body.style.transition="opacity 1.5s ease";
    document.body.style.opacity="0";
    setTimeout(()=>{
        window.location.href="index4.html";
    },1500);
},15000);
</script>

</body>
</html>
