<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3D Floating Couple</title>

<style>
body{
margin:0;
height:100vh;
background:black;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
perspective:1200px;
}

/* Background */
.scene{
width:100%;
height:100%;
background:url("bg.jpg") center/cover no-repeat;
position:relative;
}

/* birds */
.birds{
position:absolute;
top:20%;
left:-200px;
width:100%;
pointer-events:none;
}

.bird{
position:absolute;
width:40px;
height:20px;
border-top:2px solid rgba(255,255,255,.6);
border-radius:50%;
animation:fly 18s linear infinite;
}

.bird:nth-child(2){ top:40px; animation-delay:4s; transform:scale(.7);}
.bird:nth-child(3){ top:80px; animation-delay:7s; transform:scale(.5);}

@keyframes fly{
0%{transform:translateX(-150px);}
100%{transform:translateX(120vw);}
}

/* 3D container */
.wrapper{
position:absolute;
left:50%;
top:90%;
transform:translate(-50%,-50%);
transform-style:preserve-3d;
}

/* Couple */
.couple{
width:720px;
position:relative;   /* IMPORTANT FIX */
transform-style:preserve-3d;
transition:.6s ease-out;
animation:float 6s ease-in-out infinite;
overflow:visible;
z-index:999;

}

/* couple image */
.couple img{
width:100%;
display:block;
filter:
drop-shadow(0 25px 25px rgba(0,0,0,.5))
drop-shadow(0 50px 70px rgba(2, 1, 1, 0.7));
}

/* reflection */
.reflection{
transform:scaleY(-1);
opacity:.35;
filter:blur(3px);
margin-top:-10px;
mask-image:linear-gradient(transparent 10%, black 70%);
}

/* floating */
@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-15px)}
}

/* water */
.water{
position:absolute;
bottom:0;
width:100%;
height:40%;
background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.15),transparent 60%);
pointer-events:none;
}

.water::after{
content:"";
position:absolute;
left:50%;
bottom:20%;
width:600px;
height:120px;
background:radial-gradient(ellipse, rgba(0,0,0,.6), transparent 70%);
transform:translateX(-50%);
filter:blur(30px);
}

/* Welcome button */
.welcome-btn{
position:absolute;
top:30%;
left:50%;
transform:translateX(-50%) translateZ(120px);
width:300px;
cursor:pointer;
transition:.4s ease;
filter:drop-shadow(0 20px 30px rgba(0,0,0,.6));

z-index:999;           /* ← ADD THIS */
pointer-events:auto; /* ← ADD THIS */
}

.welcome-btn:hover{
transform:translateX(-50%) translateZ(260px) scale(1.08);
filter:drop-shadow(0 30px 40px rgba(0,0,0,.8));
}
</style>
</head>

<body>

<div class="scene">

<div class="birds">
<div class="bird"></div>
<div class="bird"></div>
<div class="bird"></div>
</div>

<div class="wrapper">

<div class="couple" id="card">

<img src="couple.png">

<div class="reflection">
<img src="couple.png">
</div>

<!-- Welcome sticker -->
<!-- <img src="welcome.png" class="welcome-btn"
onclick="window.location.href='page2.html'"> -->
<img src="welcome.png" class="welcome-btn" id="welcomeBtn">

</div>

</div>

<div class="water"></div>

</div>

<script>
const card=document.getElementById("card");
/* Cinematic transition to Page 2 */
document.getElementById("welcomeBtn").addEventListener("click",()=>{
    document.body.style.transition="opacity 1.5s ease";
    document.body.style.opacity="0";
    setTimeout(()=>{
        window.location.href="indexm.html";
    },1500);
});


document.addEventListener("mousemove",e=>{
 let x=(window.innerWidth/2-e.pageX)/60;
 let y=(window.innerHeight/2-e.pageY)/60;

 card.style.transform=
 `rotateY(${x}deg)
  rotateX(${y}deg)
  translateZ(150px)`;
});

document.addEventListener("mouseleave",()=>{
 card.style.transform="rotateY(0) rotateX(0)";
});
</script>

</body>
</html>
