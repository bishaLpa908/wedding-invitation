<!DOCTYPE html>
<html lang="en">
<head>

<style>

    background:#f5f2ec;
    font-family:'Playfair Display', serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

/* CARD */
.card{
    width:390px;
    height:690px;

    padding:45px 28px;
    box-sizing:border-box;
    border-radius:14px;
    box-shadow:0 18px 40px rgba(0,0,0,0.25);
}

/* Heading Animation */
.fadeIn{
    opacity:0;
    transform:translateY(15px);
    animation:fadeUp 1.5s ease forwards;
}

@keyframes fadeUp{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h1{
    font-family:'Great Vibes', cursive;
    font-size:44px;
    color:#4f6b2a;
    text-align:center;

}

.names{
    font-size:27px;

/* Reception Section */

<body>

<div class="card">

    <h1 class="fadeIn">Congratulations!</h1>

    <div class="reception fadeIn" style="animation-delay:2s">

</div>

<script>

/* Wedding message */
const message = 
"To the Newlyweds on their special day. May your love for each other always shine bright and may your life together be filled with happiness. Your love for each other is truly inspiring, and we know that you will make a beautiful life together. May your marriage be filled with love, understanding, and respect, and may you both always cherish each other's presence.";

/* Smooth word animation */
const words = message.split(" ");
let i=0;

function typeWord(){
    if(i < words.length){
        document.getElementById("text").innerHTML += words[i] + " ";
        i++;
        setTimeout(typeWord, 500);
    }
}

setTimeout(typeWord,1000);
